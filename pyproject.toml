[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-aegis"
version = "1.0.0"
description = "Self-hosted, evidence-first security validation workspace"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "anyio>=4,<5", "jsonschema>=4.23,<5"]

[project.scripts]
aegis-backup = "aegis.cli.backup:main"
aegis-restore = "aegis.cli.restore:main"
aegis-verify-audit = "aegis.cli.audit:main"
aegis-checkpoint = "aegis.cli.checkpoint:main"
aegis-replay-policy = "aegis.cli.replay_policy:main"
aegis-release = "aegis.cli.release:main"
aegis-transfer-storage = "aegis.cli.transfer:main"
aegis-init-postgres = "aegis.cli.init_postgres:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
