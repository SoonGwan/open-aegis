services:
  aegis:
    build:
      context: .
      args:
        AEGIS_INSTALL_POSTGRES: ${AEGIS_INSTALL_POSTGRES:-0}
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - path: ${AEGIS_CONFIG_ENV_FILE:-.env}
        required: false
    environment:
      AEGIS_HOST: 0.0.0.0
      AEGIS_PORT: 8787
      AEGIS_DATA_DIR: /app/data
      AEGIS_WEB_DIR: /app/web/dist
      AEGIS_HEALTH_HOST: ${AEGIS_HEALTH_HOST:-localhost}
      AEGIS_STORAGE_BACKEND: ${AEGIS_STORAGE_BACKEND:-sqlite}
      AEGIS_POSTGRES_DSN: ${AEGIS_POSTGRES_DSN:-}
      AEGIS_POSTGRES_SCHEMA: ${AEGIS_POSTGRES_SCHEMA:-}
      AEGIS_SETUP_TOKEN: ${AEGIS_SETUP_TOKEN:?Set a random AEGIS_SETUP_TOKEN in .env before starting Docker}
      AEGIS_ALLOWED_HOSTS: ${AEGIS_ALLOWED_HOSTS:-localhost,127.0.0.1}
      AEGIS_SECURE_COOKIE: ${AEGIS_SECURE_COOKIE:-0}
      AEGIS_LAB_MODE: ${AEGIS_LAB_MODE:-0}
      AEGIS_LLM_BASE_URL: ${AEGIS_LLM_BASE_URL:-https://api.openai.com/v1}
      AEGIS_LLM_MODEL: ${AEGIS_LLM_MODEL:-}
      AEGIS_LLM_API_KEY: ${AEGIS_LLM_API_KEY:-}
      AEGIS_LLM_CHAT_ENABLED: ${AEGIS_LLM_CHAT_ENABLED:-0}
      AEGIS_LLM_PRICES: ${AEGIS_LLM_PRICES:-[]}
      AEGIS_SCOPESENTRY_SOURCES: ${AEGIS_SCOPESENTRY_SOURCES:-[]}
      AEGIS_TEST_USER: ${AEGIS_TEST_USER:-}
      AEGIS_TARGET_RPS: ${AEGIS_TARGET_RPS:-2}
      AEGIS_TARGET_PARALLEL: ${AEGIS_TARGET_PARALLEL:-1}
      AEGIS_REQUEST_TIMEOUT: ${AEGIS_REQUEST_TIMEOUT:-8}
      AEGIS_DNS_TIMEOUT: ${AEGIS_DNS_TIMEOUT:-4}
      AEGIS_TASK_TIMEOUT: ${AEGIS_TASK_TIMEOUT:-300}
      AEGIS_QUEUE_TIMEOUT: ${AEGIS_QUEUE_TIMEOUT:-600}
      AEGIS_REQUEST_BUDGET: ${AEGIS_REQUEST_BUDGET:-24}
      AEGIS_REQUEST_RETRIES: ${AEGIS_REQUEST_RETRIES:-1}
      AEGIS_RETRY_DELAY: ${AEGIS_RETRY_DELAY:-0.5}
      AEGIS_CONCURRENT_TASKS: ${AEGIS_CONCURRENT_TASKS:-2}
      AEGIS_PENDING_LIMIT: ${AEGIS_PENDING_LIMIT:-30}
      AEGIS_EXPORT_PARALLEL: ${AEGIS_EXPORT_PARALLEL:-2}
      AEGIS_EXPORT_TIMEOUT: ${AEGIS_EXPORT_TIMEOUT:-120}
    volumes:
      - aegis-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  aegis-data:
