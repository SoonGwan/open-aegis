name: Verify
"on": [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/check_design.py
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python -m pytest -q
      - name: Rehearse owned execution churn and process-loss recovery
        run: python scripts/review_execution_load.py --duration 10 --clients 2 --output artifacts/execution-load-sqlite.json
      - run: python -m pip wheel --no-deps . --wheel-dir artifacts/ci-wheel
      - name: Rehearse installed runtime and maintenance commands
        run: python scripts/review_runtime_package.py --wheel-dir artifacts/ci-wheel --web-dir web/dist --runtime-lock requirements.lock
      - name: Rehearse installed SQLite goal plan recovery and fresh approvals
        run: python scripts/review_goal_recovery.py --wheel artifacts/ci-wheel/*.whl --backend sqlite --crash

  postgres-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: printf '%s\n' /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements-dev.lock -r requirements-postgres.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q tests/test_postgres_transfer.py tests/test_postgres_store.py tests/test_postgres_ledger.py tests/test_postgres_engine.py tests/test_postgres_ownership.py tests/test_postgres_graph.py tests/test_postgres_reports.py tests/test_postgres_audit_review.py tests/test_postgres_imports.py tests/test_postgres_http.py tests/test_postgres_readers.py tests/test_postgres_backups.py tests/test_postgres_bootstrap.py tests/test_postgres_releases.py tests/test_postgres_checkpoint_archive.py tests/test_postgres_worker_observations.py tests/test_postgres_worker_process.py tests/test_postgres_worker_history.py tests/test_postgres_todos.py tests/test_postgres_todos_http.py tests/test_postgres_todo_planning.py tests/test_postgres_event_planner.py tests/test_postgres_observation_context.py tests/test_postgres_observation_execution.py tests/test_postgres_goal_planner.py tests/test_postgres_goal_evidence.py tests/test_postgres_goal_retests.py tests/test_postgres_goal_rounds.py tests/test_postgres_worker_dependencies.py tests/test_postgres_next_plan.py tests/test_postgres_planning_lineage.py
        env:
          AEGIS_TEST_POSTGRES: '1'
      - run: python -m pip wheel --no-deps . --wheel-dir artifacts/postgres-wheel
      - run: python -m pytest -q tests/test_postgres_goal_selection.py
        env:
          AEGIS_TEST_POSTGRES: '1'
      - run: python -m pytest -q tests/test_postgres_goal_observations.py tests/test_postgres_goal_observation_retests.py tests/test_postgres_observation_rounds.py tests/test_postgres_observation_todos.py
        env:
          AEGIS_TEST_POSTGRES: '1'
      - run: python scripts/review_postgres_transfer.py --wheel-dir artifacts/postgres-wheel
      - name: Rehearse native execution churn and process-loss recovery
        run: python scripts/review_execution_load.py --postgres --duration 10 --clients 2 --output artifacts/execution-load-postgres.json
      - name: Verify native event batching, rollback and asset ordering
        run: python -m pytest -q tests/test_postgres_event_planner_batches.py tests/test_postgres_event_planner_metrics.py
        env:
          AEGIS_TEST_POSTGRES: '1'
      - name: Verify native MCP review and atomic scoped result admission
        run: python -m pytest -q tests/test_mcp_registry.py tests/test_mcp_result_store.py
        env:
          AEGIS_TEST_POSTGRES: '1'
      - name: Rehearse installed native goal plan recovery and fresh approvals
        run: python scripts/review_goal_recovery.py --wheel artifacts/postgres-wheel/*.whl --backend postgres --crash --database-crash --database-crash-in-flight --database-crash-write --database-crash-audit

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        postgres-extra: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and rehearse owned image and disposable volume
        env:
          POSTGRES_EXTRA: ${{ matrix.postgres-extra }}
        run: |
          if [ "$POSTGRES_EXTRA" = "true" ]; then
            python3 scripts/review_container.py --postgres-extra
          else
            python3 scripts/review_container.py
          fi

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        postgres: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rehearse actual Compose deployment and owned database recovery
        env:
          POSTGRES: ${{ matrix.postgres }}
        run: |
          if [ "$POSTGRES" = "true" ]; then
            python3 scripts/review_compose.py --postgres
          else
            python3 scripts/review_compose.py
          fi
