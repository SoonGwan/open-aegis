name: Verify
"on": [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/check_design.py
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps . --wheel-dir artifacts/ci-wheel
      - name: Rehearse installed runtime and maintenance commands
        run: python scripts/review_runtime_package.py --wheel-dir artifacts/ci-wheel --web-dir web/dist --runtime-lock requirements.lock

  postgres-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: printf '%s\n' /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements-dev.lock -r requirements-postgres.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q tests/test_postgres_transfer.py tests/test_postgres_store.py tests/test_postgres_ledger.py tests/test_postgres_engine.py tests/test_postgres_ownership.py tests/test_postgres_graph.py tests/test_postgres_reports.py tests/test_postgres_audit_review.py tests/test_postgres_imports.py tests/test_postgres_http.py tests/test_postgres_readers.py tests/test_postgres_backups.py tests/test_postgres_bootstrap.py tests/test_postgres_releases.py tests/test_postgres_checkpoint_archive.py tests/test_postgres_worker_observations.py
        env:
          AEGIS_TEST_POSTGRES: '1'
      - run: python -m pip wheel --no-deps . --wheel-dir artifacts/postgres-wheel
      - run: python scripts/review_postgres_transfer.py --wheel-dir artifacts/postgres-wheel

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        postgres-extra: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and rehearse owned image and disposable volume
        env:
          POSTGRES_EXTRA: ${{ matrix.postgres-extra }}
        run: |
          if [ "$POSTGRES_EXTRA" = "true" ]; then
            python3 scripts/review_container.py --postgres-extra
          else
            python3 scripts/review_container.py
          fi
